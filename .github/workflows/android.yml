name: Build Android APK

on:
  push:
    tags:
      - 'android-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-31 build-tools;31.0.0 ndk;22.1.7171670 cmake;3.18.1'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Build libromfs-generator
        run: |
          LIBROMFS_PATH="third_party/borealis/library/lib/extern/libromfs/generator"
          cmake -B build_libromfs_generator "$LIBROMFS_PATH" -G Ninja
          cmake --build build_libromfs_generator
          cp build_libromfs_generator/libromfs-generator ./libromfs-generator

      - name: Create JNI symlinks
        run: |
          mkdir -p android-project/app/jni
          cd android-project/app/jni
          ln -sf ../../../third_party/borealis/library/lib/extern/SDL SDL
          ln -sf ../../.. borealis
          cd ../../..

      - name: Copy libromfs-generator to JNI path
        run: |
          cp libromfs-generator android-project/app/jni/borealis/libromfs-generator

      - name: Build APK
        id: build
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show build artifacts
        run: |
          echo "===== APK FILES ====="
          find android-project -name "*.apk" 2>/dev/null || echo "No APK found"
          echo "===== SO FILES ====="
          find android-project -name "*.so" 2>/dev/null || echo "No .so found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GBAStation-android-debug
          path: android-project/app/build/outputs/apk/debug/*.apk
