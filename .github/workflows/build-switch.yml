name: Build Switch NRO

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 修复 Git 权限
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 安装依赖
        run: |
          dkp-pacman -S --noconfirm --needed switch-dev switch-curl

      - name: 编译 NRO
        run: |
          chmod +x switchbuild.sh
          ./switchbuild.sh

      - name: 检查输出文件
        run: |
          echo "===== NRO FILES ====="
          find . -name "*.nro"

      - name: 生成 version.json
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          ZIP_FILE="GBAStation-$TAG_NAME.zip"

          CHANGELOG=$(git tag -l --format='%(contents)' "$TAG_NAME")

          CHANGELOG_ESCAPED=$(printf '%s' "$CHANGELOG" \
            | sed ':a;N;$!ba;s/\n/\\n/g' \
            | sed 's/"/\\"/g')

          NRO_FILE="build_switch/GBAStation.nro"
          cp "$NRO_FILE" GBAStation.nro
          cmake -E tar cf "$ZIP_FILE" --format=zip GBAStation.nro
          rm GBAStation.nro

          # 文件大小（字节）
          FILE_SIZE=$(stat -c%s "$ZIP_FILE")

          cat > version.json <<EOF
          {
            "version": "$TAG_NAME",
            "changelog": "$CHANGELOG_ESCAPED",
            "download": "$TAG_NAME/$ZIP_FILE",
            "size": $FILE_SIZE
          }
          EOF

          echo "===== version.json ====="
          cat version.json

      - name: Clone Release Repo
        run: |
          git clone https://x-access-token:${{ secrets.RELEASE_REPO_TOKEN }}@github.com/beiklive/GBAStation_Release.git release_repo

      - name: 创建目录结构
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          mkdir -p release_repo/latest
          mkdir -p release_repo/$TAG_NAME

      - name: 拷贝发布文件
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          ZIP_FILE="GBAStation-$TAG_NAME.zip"

          # latest
          cp "$ZIP_FILE" release_repo/latest/GBAStation.zip
          cp version.json release_repo/latest/version.json

          # 历史版本
          cp "$ZIP_FILE" release_repo/$TAG_NAME/$ZIP_FILE
          cp version.json release_repo/$TAG_NAME/version.json

          # 根目录
          cp version.json release_repo/version.json

      - name: 更新 README 更新说明
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          CHANGELOG=$(git tag -l --format='%(contents)' "$TAG_NAME")

          README_FILE="release_repo/README.md"

          # README 不存在则创建
          touch "$README_FILE"

          # 不存在更新说明标题则创建
          if ! grep -q "^#更新说明" "$README_FILE"; then
            echo -e "\n#更新说明\n" >> "$README_FILE"
          fi

          # 构造插入内容
          NEW_CONTENT=$(cat <<EOF

          ## ${TAG_NAME}

          ${CHANGELOG}

          EOF
          )

          # 在 #更新说明 后插入
          awk -v insert="$NEW_CONTENT" '
          {
            print
            if ($0 ~ /^#更新说明$/) {
              print insert
            }
          }' "$README_FILE" > "$README_FILE.tmp"

          mv "$README_FILE.tmp" "$README_FILE"

          echo "===== README.md ====="
          cat "$README_FILE"

      - name: 提交到 Release Repo
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          cd release_repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Release $TAG_NAME" || echo "Nothing to commit"

          git push

      - name: 延迟刷新 jsDelivr 缓存
        run: |
          echo "等待 60 秒后刷新 CDN 缓存..."
          sleep 60

          curl -L \
            "https://purge.jsdelivr.net/gh/beiklive/GBAStation_Release@main/version.json"

          echo "jsDelivr 缓存刷新完成"
