name: Build Switch NRO

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 修复 Git 权限
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 安装依赖
        run: |
          dkp-pacman -S --noconfirm --needed switch-dev

      - name: 编译 NRO
        run: |
          chmod +x switchbuild.sh
          ./switchbuild.sh

      - name: 检查输出文件
        run: |
          find . -name "*.nro"

      - name: 生成 version.json
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          CHANGELOG=$(git tag -l --format='%(contents)' "$TAG_NAME")

          CHANGELOG_ESCAPED=$(printf '%s' "$CHANGELOG" \
            | sed ':a;N;$!ba;s/\n/\\n/g' \
            | sed 's/"/\\"/g')

          cat > version.json <<EOF
          {
            "version": "$TAG_NAME",
            "changelog": "$CHANGELOG_ESCAPED",
            "download":  "$TAG_NAME/GBAStation-$TAG_NAME.nro"
          }
          EOF

          cat version.json

      - name: Clone Release Repo
        run: |
          git clone https://x-access-token:${{ secrets.RELEASE_REPO_TOKEN }}@github.com/beiklive/GBAStation_Release.git release_repo

      - name: 创建目录结构
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          mkdir -p release_repo/latest
          mkdir -p release_repo/$TAG_NAME

      - name: 拷贝发布文件
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          # latest
          cp build_switch/GBAStation.nro release_repo/latest/GBAStation.nro
          cp version.json release_repo/latest/version.json

          # 历史版本
          cp build_switch/GBAStation.nro release_repo/$TAG_NAME/GBAStation-$TAG_NAME.nro
          cp version.json release_repo/$TAG_NAME/version.json

          # 根目录
          cp version.json release_repo/version.json

      - name: 提交到 Release Repo
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          cd release_repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Release $TAG_NAME" || echo "Nothing to commit"

          git push