name: Build Switch NRO

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 修复 git 权限
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 安装依赖
        run: |
          dkp-pacman -S --noconfirm --needed switch-dev

      - name: 编译
        run: |
          chmod +x switchbuild.sh
          ./switchbuild.sh

      - name: 查看输出文件
        run: |
          find . -name "*.nro"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build_switch/GBAStation.nro