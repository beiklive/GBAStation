name: Build Switch NRO

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 修复 Git 权限
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 安装依赖
        run: |
          dkp-pacman -S --noconfirm --needed switch-dev switch-curl

      - name: 编译 NRO
        run: |
          chmod +x switchbuild.sh
          ./switchbuild.sh

      - name: 检查输出文件
        run: |
          echo "===== NRO FILES ====="
          find . -name "*.nro"

      - name: 生成发布文件
        id: prep
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          VERSION_NAME=${TAG_NAME#v}
          VERSION_NAME=${VERSION_NAME#V}
          ZIP_FILE="GBAStation.zip"
          CHANGELOG_FILE="${VERSION_NAME}.txt"

          CHANGELOG=$(git tag -l --format='%(contents)' "$TAG_NAME")

          NRO_FILE="build_switch/GBAStation.nro"
          NDS_STUB_NRO_FILE="build_switch/GBAStationNDSStub.nro"
          THREEDS_STUB_NRO_FILE="build_switch/GBAStation3DSStub.nro"

          mkdir -p switch
          mkdir -p GBAStation/core
          cp "$NRO_FILE" switch/GBAStation.nro
          cp "$NDS_STUB_NRO_FILE" GBAStation/core/GBAStationNDSStub.nro
          cp "$THREEDS_STUB_NRO_FILE" GBAStation/core/GBAStation3DSStub.nro
          cmake -E tar cf "$ZIP_FILE" --format=zip switch GBAStation
          rm -rf switch GBAStation

          printf '%s\n' "$CHANGELOG" > "$CHANGELOG_FILE"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

          echo "===== ZIP FILE ====="
          ls -lh "$ZIP_FILE"
          echo "===== CHANGELOG FILE ====="
          cat "$CHANGELOG_FILE"

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.prep.outputs.changelog_file }}
          files: ${{ steps.prep.outputs.zip_file }}

      - name: Clone Release Repo
        run: |
          git clone https://x-access-token:${{ secrets.RELEASE_REPO_TOKEN }}@github.com/beiklive/GBAStation_Release.git release_repo

      - name: 保存版本更新说明
        run: |
          cp "${{ steps.prep.outputs.changelog_file }}" "release_repo/${{ steps.prep.outputs.changelog_file }}"

          NDS_STUB_NRO_FILE="build_switch/GBAStationNDSStub.nro"
          NDS_STUB_ZIP_FILE="GBAStationNDSStub.zip"
          THREEDS_STUB_NRO_FILE="build_switch/GBAStation3DSStub.nro"
          THREEDS_STUB_ZIP_FILE="GBAStation3DSStub.zip"

          mkdir -p nds_stub_package
          cp "$NDS_STUB_NRO_FILE" nds_stub_package/GBAStationNDSStub.nro
          cmake -E chdir nds_stub_package cmake -E tar cf "../$NDS_STUB_ZIP_FILE" --format=zip GBAStationNDSStub.nro
          rm -rf nds_stub_package

          mkdir -p "release_repo/emu_res/core"
          cp "$NDS_STUB_ZIP_FILE" "release_repo/emu_res/core/GBAStationNDSStub.zip"

          mkdir -p 3ds_stub_package
          cp "$THREEDS_STUB_NRO_FILE" 3ds_stub_package/GBAStation3DSStub.nro
          cmake -E chdir 3ds_stub_package cmake -E tar cf "../$THREEDS_STUB_ZIP_FILE" --format=zip GBAStation3DSStub.nro
          rm -rf 3ds_stub_package
          cp "$THREEDS_STUB_ZIP_FILE" "release_repo/emu_res/core/GBAStation3DSStub.zip"

          echo "===== NDS STUB ZIP FILE ====="
          ls -lh "release_repo/emu_res/core/GBAStationNDSStub.zip"
          ls -lh "release_repo/emu_res/core/GBAStation3DSStub.zip"

      - name: 更新 README 更新说明
        run: |
          VERSION_NAME="${{ steps.prep.outputs.version_name }}"
          CHANGELOG_FILE="${{ steps.prep.outputs.changelog_file }}"

          CHANGELOG=$(cat "$CHANGELOG_FILE")

          README_FILE="release_repo/README.md"

          # README 不存在则创建
          touch "$README_FILE"

          # 不存在更新说明标题则创建
          if ! grep -q "^#更新说明" "$README_FILE"; then
            echo -e "\n#更新说明\n" >> "$README_FILE"
          fi

          # 构造插入内容
          NEW_CONTENT=$(cat <<EOF

          ## ${VERSION_NAME}

          ${CHANGELOG}

          EOF
          )

          # 在 #更新说明 后插入
          awk -v insert="$NEW_CONTENT" '
          {
            print
            if ($0 ~ /^#更新说明$/) {
              print insert
            }
          }' "$README_FILE" > "$README_FILE.tmp"

          mv "$README_FILE.tmp" "$README_FILE"

          echo "===== README.md ====="
          cat "$README_FILE"

      - name: 提交到 Release Repo
        run: |
          TAG_NAME=${GITHUB_REF_NAME}

          cd release_repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Release $TAG_NAME" || echo "Nothing to commit"

          git push

