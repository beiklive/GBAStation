<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GBAStation Web 管理器</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-titlebar">
    <div class="brand">
      <span class="brand-mark"><img src="/api/logo" alt="GBAStation"></span>
      <div class="brand-copy">
        <strong>GBAStation</strong>
        <span>Web Manager</span>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <button class="upload-zone" id="uploadZone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>导入 ROM</span>
        <small>游戏会被自动添加到游戏库</small>
      </button>
      <div class="upload-actions">
        <button id="chooseRomFilesBtn"><i class="fa-solid fa-file-arrow-up"></i><span>选择文件</span></button>
        <button id="chooseRomFolderBtn"><i class="fa-solid fa-folder-open"></i><span>选择目录</span></button>
      </div>
      <label class="upload-option">
        <span>导入名称到映射文件</span>
        <input id="importNameMappingSwitch" type="checkbox">
      </label>
      <input id="romInput" type="file" multiple accept=".gba,.gb,.gbc,.nes,.fds,.sfc,.smc,.nds" hidden>
      <input id="romFolderInput" type="file" multiple webkitdirectory directory hidden>
      <input id="fileBrowserInput" type="file" multiple hidden>
      <input id="folderBrowserInput" type="file" multiple webkitdirectory directory hidden>

      <div class="sidebar-nav">
        <button id="libraryModeBtn" class="active"><i class="fa-solid fa-gamepad"></i><span>游戏库</span></button>
        <button id="filesModeBtn"><i class="fa-solid fa-folder-open"></i><span>文件管理</span></button>
        <button id="albumModeBtn"><i class="fa-solid fa-images"></i><span>相册浏览</span></button>
      </div>

      <nav class="platform-tabs" id="platformTabs"></nav>

      <div class="theme-box">
        <span>主题</span>
        <div class="segmented">
          <button id="lightBtn" class="active" title="浅色"><i class="fa-solid fa-sun"></i></button>
          <button id="darkBtn" title="VS Code 深色"><i class="fa-solid fa-moon"></i></button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1>游戏库</h1>
          <p id="summaryText">正在读取 Switch 游戏库</p>
        </div>
        <label class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" type="search" placeholder="搜索游戏名、路径或平台">
        </label>
        <div class="library-tools">
          <label class="select-field">
            <span>排序</span>
            <select id="sortSelect">
              <option value="recent">最近游玩</option>
              <option value="playCount">最多次打开</option>
              <option value="title">Title 名称</option>
            </select>
          </label>
          <div class="segmented view-toggle">
            <button id="gridViewBtn" class="active" title="网格"><i class="fa-solid fa-grip"></i></button>
            <button id="listViewBtn" title="列表"><i class="fa-solid fa-list"></i></button>
          </div>
          <div class="selection-tools">
            <button id="multiSelectBtn" class="flat"><i class="fa-solid fa-square-check"></i><span>多选</span></button>
            <button id="selectPageBtn" class="flat" hidden><i class="fa-solid fa-list-check"></i><span>全选本页</span></button>
            <button id="deleteSelectedBtn" class="flat danger" hidden><i class="fa-solid fa-trash-can"></i><span>删除选中</span></button>
            <button id="cancelSelectionBtn" class="flat" hidden><i class="fa-solid fa-xmark"></i><span>取消</span></button>
          </div>
        </div>
      </header>

      <section class="progress-panel" id="progressPanel" hidden>
        <div>
          <strong id="progressTitle">处理中</strong>
          <span id="progressText">准备执行</span>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
      </section>

      <section id="filePanel" class="file-panel" hidden>
        <div class="file-head">
          <div>
            <h2>文件管理</h2>
            <p id="fileSummary">浏览 Switch 内存卡文件</p>
          </div>
          <div class="file-actions">
            <button id="fileUploadBtn"><i class="fa-solid fa-file-arrow-up"></i><span>上传文件</span></button>
            <button id="folderUploadBtn"><i class="fa-solid fa-folder-open"></i><span>上传文件夹</span></button>
            <button id="newFolderBtn"><i class="fa-solid fa-folder-plus"></i><span>新建文件夹</span></button>
          </div>
        </div>
        <div class="file-toolbar">
          <button id="fileHomeBtn" title="根目录"><i class="fa-solid fa-house"></i></button>
          <button id="fileUpBtn" title="上级目录"><i class="fa-solid fa-arrow-up"></i></button>
          <button id="fileRefreshBtn" title="刷新"><i class="fa-solid fa-rotate"></i></button>
          <label class="file-path-field">
            <i class="fa-solid fa-folder-open"></i>
            <input id="filePathInput" type="text" spellcheck="false" placeholder="sdmc:/">
          </label>
          <button id="fileGoBtn"><i class="fa-solid fa-arrow-right"></i><span>打开</span></button>
        </div>
        <div id="fileList" class="file-list"></div>
      </section>

      <section id="albumPanel" class="album-panel" hidden>
        <div class="file-head">
          <div>
            <h2>相册浏览</h2>
            <p id="albumSummary">按时间顺序显示 Album 中的图片和视频</p>
          </div>
          <div class="file-actions">
            <button id="albumRefreshBtn"><i class="fa-solid fa-rotate"></i><span>刷新</span></button>
          </div>
        </div>
        <div id="albumList" class="album-list"></div>
      </section>

      <section id="gameSections" class="game-sections"></section>
      <nav class="pager" id="pager" aria-label="游戏分页">
        <button id="prevPageBtn"><i class="fa-solid fa-chevron-left"></i><span>上一页</span></button>
        <span id="pageText">1 / 1</span>
        <button id="nextPageBtn"><span>下一页</span><i class="fa-solid fa-chevron-right"></i></button>
      </nav>
    </main>
  </div>

  <dialog id="gameDialog" class="game-dialog">
    <div class="dialog-head">
      <div>
        <span id="detailPlatform" class="badge">GBA</span>
        <h2 id="detailTitle">游戏详情</h2>
      </div>
      <button class="icon-btn" id="closeGameDialogBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="detail-layout">
      <section class="detail-primary">
        <img id="detailCover" class="detail-cover" alt="游戏封面">
        <div class="stats">
          <span><i class="fa-solid fa-clock"></i><b id="playTimeText">0 分钟</b></span>
          <span><i class="fa-solid fa-play"></i><b id="playCountText">0 次</b></span>
        </div>
        <label class="field">
          <span>映射名称</span>
          <input id="titleInput" type="text">
        </label>
        <div class="actions compact-actions">
          <button id="saveTitleBtn"><i class="fa-solid fa-floppy-disk"></i><span>保存名称</span></button>
          <button id="replaceCoverBtn"><i class="fa-solid fa-image"></i><span>替换封面</span></button>
          <button id="removeBtn" class="danger"><i class="fa-solid fa-trash-can"></i><span>移除游戏</span></button>
        </div>
      </section>

      <section class="save-panel">
        <div class="save-section-head">
          <h3>存档截图</h3>
          <button id="refreshSavesBtn"><i class="fa-solid fa-rotate"></i><span>刷新</span></button>
        </div>
        <div id="saveThumbs" class="save-thumbs"></div>

        <div class="save-section-head">
          <h3>即时存档</h3>
        </div>
        <div id="stateSaveList" class="save-list"></div>

        <div class="save-section-head">
          <h3>电池存档</h3>
          <button id="replaceBatteryBtn"><i class="fa-solid fa-file-import"></i><span>替换 SAV</span></button>
        </div>
        <div id="batterySaveList" class="save-list"></div>
      </section>

      <section class="config-panel">
        <div class="save-section-head">
          <h3>配置信息</h3>
          <button id="saveConfigBtn"><i class="fa-solid fa-floppy-disk"></i><span>保存配置</span></button>
        </div>
        <div id="gameConfigFields" class="config-fields"></div>
      </section>
    </div>

    <input id="saveInput" type="file" accept=".sav,.ss0,.ss1,.ss2,.ss3,.ss4,.ss5,.ss6,.ss7,.ss8,.ss9" hidden>
    <input id="coverInput" type="file" accept="image/*" hidden>
  </dialog>

  <dialog id="coverChoiceDialog" class="choice-dialog">
    <div class="dialog-head">
      <h3>替换封面</h3>
      <button class="icon-btn" id="closeCoverChoiceBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="choice-actions">
      <button id="chooseSwitchCoverBtn"><i class="fa-solid fa-images"></i><span>从 Switch 选择</span></button>
      <button id="chooseLocalCoverBtn"><i class="fa-solid fa-crop-simple"></i><span>从本地裁剪</span></button>
    </div>
  </dialog>

  <dialog id="imageDialog" class="image-dialog">
    <div class="dialog-head">
      <h3>选择 Switch 图片</h3>
      <button class="icon-btn" id="closeImageDialogBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="imageGrid" class="image-grid"></div>
  </dialog>

  <dialog id="fileImageDialog" class="file-image-dialog">
    <div class="dialog-head">
      <h3 id="fileImageTitle">图片预览</h3>
      <button class="icon-btn" id="closeFileImageBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <img id="fileImagePreview" alt="图片预览">
  </dialog>

  <dialog id="videoDialog" class="file-image-dialog">
    <div class="dialog-head">
      <h3 id="videoTitle">视频预览</h3>
      <button class="icon-btn" id="closeVideoBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <video id="videoPreview" controls playsinline></video>
  </dialog>

  <dialog id="textEditorDialog" class="text-editor-dialog">
    <div class="dialog-head">
      <div>
        <h3 id="textEditorTitle">文本编辑</h3>
        <p id="textEditorPath"></p>
      </div>
      <button class="icon-btn" id="closeTextEditorBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <textarea id="textEditorContent" spellcheck="false"></textarea>
    <div class="text-editor-actions">
      <button id="saveTextEditorBtn"><i class="fa-solid fa-floppy-disk"></i><span>保存</span></button>
    </div>
  </dialog>

  <dialog id="cropDialog" class="crop-dialog">
    <div class="dialog-head">
      <h3>裁剪封面</h3>
      <button class="icon-btn" id="closeCropDialogBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <canvas id="cropCanvas" width="480" height="480"></canvas>
    <div class="crop-controls">
      <label>缩放 <input id="cropScale" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>X <input id="cropX" type="range" min="-240" max="240" step="1" value="0"></label>
      <label>Y <input id="cropY" type="range" min="-160" max="160" step="1" value="0"></label>
      <button id="uploadCroppedBtn"><i class="fa-solid fa-upload"></i><span>上传封面</span></button>
    </div>
  </dialog>

  <dialog id="uploadDialog" class="upload-dialog">
    <div class="dialog-head upload-dialog-head">
      <div>
        <h3>上传队列</h3>
        <p id="uploadSummaryText">等待选择 ROM 文件</p>
      </div>
      <button class="icon-btn" id="closeUploadDialogBtn" title="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="upload-overview">
      <div>
        <span>总进度</span>
        <strong id="uploadTotalPercent">0%</strong>
      </div>
      <div>
        <span>上传速度</span>
        <strong id="uploadTotalSpeed">0 B/s</strong>
      </div>
      <div>
        <span>已完成</span>
        <strong id="uploadDoneCount">0 / 0</strong>
      </div>
    </div>
    <div class="progress-track upload-total-track"><span id="uploadTotalBar"></span></div>
    <div class="upload-dialog-tools">
      <button id="cancelAllUploadsBtn" class="danger"><i class="fa-solid fa-ban"></i><span>全部取消</span></button>
    </div>
    <div id="uploadQueueList" class="upload-queue-list"></div>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
