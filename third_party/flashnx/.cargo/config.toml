# Phase 1.1 attempt: build std for the existing tier-3 Switch target.
#
# The upstream `aarch64-nintendo-switch-freestanding` spec is missing 3 fields
# the 3DS target has, which stdlib's cfg_select! gates check:
#   - target-family = ["unix"]
#   - env = "newlib"
#   - has-thread-local = true
#
# Instead of forking the spec into a JSON (which now requires a flag rustc
# doesn't yet recognize on this nightly), we override the cfg gates directly
# via rustflags. This applies to stdlib too because of -Z build-std.
[build]
target = "aarch64-nintendo-switch-freestanding"
rustflags = [
    "--cfg", "target_family=\"unix\"",
    "--cfg", "target_env=\"newlib\"",
    # `cfg(unix)` is a well-known shortcut that's normally auto-derived from
    # the target spec's family field; --cfg target_family doesn't propagate
    # to it. libc and stdlib both use `cfg(unix)` directly, so we must set
    # both forms.
    "--cfg", "unix",
    # Recent nightlies deny manually setting "built-in" cfgs via --cfg.
    # We're intentionally overriding these because the upstream target spec
    # is missing fields it should have for std support, so bypass the lint.
    "-A", "explicit_builtin_cfgs_in_flags",
    "-Z", "has-thread-local=true",
    # NOTE (2026-05-31): a `#[thread_local]` access faults (DataAbort FAR≈0x98)
    # in std's `panic_count::increase` whenever code panics on the libnx worker
    # thread — the thread's TLS block isn't set up for Rust std, so the panic
    # message is lost. `-Z tls-model=local-exec` was tried and did NOT fix it
    # (the block, not the access model, is the problem), so it's not set here.
    # Panics are still diagnosable: cpp/src/exception.cpp does a stack-scan
    # backtrace (no frame pointers) → addr2line gives the panicking function.
    # getrandom has no built-in backend for our target → opt into "custom"
    # mode. We provide __getrandom_v03_custom in src/lib.rs. Stub LCG for
    # now; Phase 2 will route to libnx csrngGetRandomBytes.
    "--cfg", "getrandom_backend=\"custom\"",
]

[unstable]
build-std = ["std", "panic_abort", "core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# Phase 1.2: stdlib's build.rs (in rust-src) skips the `restricted_std` cfg
# when target_vendor==nintendo && target_env==newlib. Our target spec doesn't
# declare env=newlib (upstream's freestanding spec leaves it empty), so we
# inject the env-var that build.rs reads. Without this, every crates.io dep
# that uses std (memchr, simd-adler32, ...) fails with "use of unstable
# feature restricted_std" because it doesn't `#![feature(restricted_std)]`.
[env]
# force=true is required: cargo sets CARGO_CFG_TARGET_ENV internally based on
# the target spec (empty for freestanding), and without force it wins over us.
CARGO_CFG_TARGET_ENV = { value = "newlib", force = true }
